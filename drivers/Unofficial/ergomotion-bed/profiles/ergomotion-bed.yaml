name: ergomotion-bed
components:
- id: main
  label: "Flat"
  capabilities:
  - id: momentary
    version: 1
  - id: refresh
    version: 1
- id: head
  label: "Head Position"
  capabilities:
  - id: switchLevel
    version: 1
- id: foot
  label: "Foot Position"
  capabilities:
  - id: switchLevel
    version: 1
- id: lumbar
  label: "Lumbar Position"
  capabilities:
  - id: switchLevel
    version: 1
- id: zeroG
  label: "Zero-G"
  capabilities:
  - id: momentary
    version: 1
- id: stop
  label: "Stop"
  capabilities:
  - id: momentary
    version: 1
- id: mema
  label: "Memory-A"
  capabilities:
  - id: momentary
    version: 1
- id: memb
  label: "Memory-B"
  capabilities:
  - id: momentary
    version: 1
- id: headMassage
  label: "Head Massage"
  capabilities:
  - id: fanSpeed
    version: 1
- id: footMassage
  label: "Foot Massage"
  capabilities:
  - id: fanSpeed
    version: 1
- id: massageTimer
  label: "Massage Timer"
  capabilities:
  - id: mode
    version: 1
- id: vibration
  label: "Vibration Pattern"
  capabilities:
  - id: fanSpeed
    version: 1
preferences:
  - name: ipAddress
    title: "Bed IP Address"
    description: "Enter the IP address of your Ergomotion Bed"
    required: true
    preferenceType: string
    definition:
      stringType: "text"
      default: "192.168.1.xxx"
  - name: lumbarSeconds
    title: "Lumbar full travel (seconds)"
    description: "Time for the lumbar to go from fully down to fully up. The lumbar slider estimates position from this."
    required: false
    preferenceType: number
    definition:
      minimum: 2
      maximum: 60
      default: 15
  - name: presetSeconds
    title: "Preset settle time (seconds)"
    description: "Wait this long after Flat/Zero-G/Memory before reading the position"
    required: false
    preferenceType: integer
    definition:
      minimum: 5
      maximum: 60
      default: 25
  - name: headMax
    title: "Head max travel (raw, 0 = auto)"
    description: "Raw head position at full raise. Leave 0 to learn it by setting Head Position to 100%"
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 65535
      default: 0
  - name: footMax
    title: "Foot max travel (raw, 0 = auto)"
    description: "Raw foot position at full raise. Leave 0 to learn it by setting Foot Position to 100%"
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 65535
      default: 0
