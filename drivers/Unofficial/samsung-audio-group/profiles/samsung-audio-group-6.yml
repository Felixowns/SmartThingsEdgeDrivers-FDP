preferences:
  - name: "pollInterval"
    title: "Status refresh interval (seconds)"
    description: "How often each speaker is checked"
    required: false
    preferenceType: integer
    definition:
      minimum: 15
      maximum: 600
      default: 60
  - name: "speakerIps"
    title: "Speaker IPs (always included)"
    description: "Comma-separated. These are always checked even if network discovery misses them. Newly discovered speakers are still added automatically."
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: "none"
  - name: "excludedIps"
    title: "Excluded IPs"
    description: "Comma-separated. Speakers at these IPs are removed and never added, even if discovered or listed above."
    required: false
    preferenceType: string
    definition:
      stringType: text
      default: "none"
  - name: "resetSpeakers"
    title: "Rebuild speaker list"
    description: "Flip this switch to forget all speakers and search again"
    required: false
    preferenceType: boolean
    definition:
      default: false
