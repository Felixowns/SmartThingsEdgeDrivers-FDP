name: tesla-wall-connector
components:
  - id: main
    label: Tesla Wall Connector
    capabilities:
      - id: evseState
        version: 1
      - id: powerMeter
        version: 1
      - id: energyMeter
        version: 1
      - id: powerConsumptionReport
        version: 1
      - id: voltageMeasurement
        version: 1
      - id: temperatureMeasurement
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: ElectricVehicleCharger
  - id: session
    label: Current Session
    capabilities:
      - id: energyMeter
        version: 1
  - id: handle
    label: Charging Handle
    capabilities:
      - id: temperatureMeasurement
        version: 1
  - id: mcu
    label: Internal Processor
    capabilities:
      - id: temperatureMeasurement
        version: 1
preferences:
  - name: ipAddress
    title: "Wall Connector IP Address"
    description: "Optional. Leave as-is to use the auto-discovered IP. Set this to force a specific IP."
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 7
      maxLength: 15
      default: "192.168.1.xxx"
  - name: pollingInterval
    title: "Polling Interval (Seconds)"
    description: "Frequency to poll the local API (Minimum 15s recommended)"
    required: true
    preferenceType: integer
    definition:
      minimum: 15
      maximum: 300
      default: 30
