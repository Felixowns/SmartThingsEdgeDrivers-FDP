name: third-reality-plug
components:
- id: main
  capabilities:
  - id: switch
    version: 1
  - id: powerMeter
    version: 1
  - id: energyMeter
    version: 1
  - id: voltageMeasurement
    version: 1
  - id: currentMeasurement
    version: 1
  - id: refresh
    version: 1
  categories:
  - name: SmartPlug

preferences:
  - name: "powerOnState"
    title: "Power-On State"
    description: "Behavior when power is restored after an outage"
    required: false
    preferenceType: enumeration
    definition:
      default: "255"
      options:
        "0": "Always Off"
        "1": "Always On"
        "255": "Restore Last State"

  - name: "meteringOnlyMode"
    title: "Metering Only Mode (Safety Lock)"
    description: "Prevent turning off the plug via app or automations"
    required: false
    preferenceType: boolean
    definition:
      default: false