name: ring-contact
components:
  - id: main
    capabilities:
      - id: contactSensor
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: ContactSensor
preferences:
  - name: bridgeIp
    title: "Bridge IP Address"
    preferenceType: string
    definition:
      stringType: text
      default: "192.168.1.17"
  - name: bridgePort
    title: "Bridge Port"
    preferenceType: integer
    definition:
      default: 8080
      minimum: 1
      maximum: 65535