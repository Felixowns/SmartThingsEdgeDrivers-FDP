name: third-reality-plug-gen3
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: powerMeter
        version: 1
      - id: energyMeter
        version: 1
      - id: powerConsumptionReport
        version: 1
      - id: voltageMeasurement
        version: 1
      - id: currentMeasurement
        version: 1
      - id: firmwareUpdate
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: SmartPlug
preferences:
  - name: "powerOnState"
    title: "Power-On State"
    description: "Behavior when power is restored after an outage"
    required: false
    preferenceType: enumeration
    definition:
      options:
        "0": "Always Off"
        "1": "Always On"
        "2": "Toggle"
        "255": "Restore Last State"
      default: "255"
  - name: "meteringOnlyMode"
    title: "Metering Only Mode (Safety Lock)"
    description: "Relay is forced to stay on and the plug only meters (also blocks the physical button)"
    required: false
    preferenceType: boolean
    definition:
      default: false
  - name: "ledBrightness"
    title: "LED Brightness (%)"
    description: "Brightness of the status LED (0 = off)"
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 100
      default: 100
  - name: "countdownToTurnOff"
    title: "Countdown ON to OFF (seconds)"
    description: "After turning on, turn off after this many seconds. 0 = disabled"
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 65535
      default: 0
  - name: "countdownToTurnOn"
    title: "Countdown OFF to ON (seconds)"
    description: "After turning off, turn back on after this many seconds. 0 = disabled"
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 65535
      default: 0
  - name: "powerRiseThreshold"
    title: "Power Rise Report Threshold (W)"
    description: "Report immediately when power jumps by this much. Low values (e.g. 1) make power updates much faster. 0 = plug default"
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 3200
      default: 0
  - name: "powerDropThreshold"
    title: "Power Drop Report Threshold (W)"
    description: "Report immediately when power falls by this much. 0 = plug default"
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 3200
      default: 0
